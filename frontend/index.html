<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <title>Inclusive Comm</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="app-header">
        <h1>Communicate <i class="fa-solid fa-hands-asl-interpreting"></i></h1>
        <button id="emergency-btn" class="emergency-btn" aria-label="Activate Emergency Mode">
            <i class="fa-solid fa-triangle-exclamation"></i> SOS
        </button>
    </header>

    <main class="app-main">
        <!-- Navigation Tabs -->
        <nav class="tabs">
            <button class="tab-btn active" data-target="board-view"><i class="fa-solid fa-grip"></i> Board</button>
            <button class="tab-btn" data-target="gesture-view"><i class="fa-solid fa-video"></i> Gestures</button>
        </nav>

        <!-- Communication Board View -->
        <section id="board-view" class="view-section active">
            <div class="voice-controls">
                <button id="mic-btn" class="mic-btn" aria-label="Voice Input">
                    <i class="fa-solid fa-microphone"></i> Speak
                </button>
                <div id="voice-status" class="voice-status"></div>
            </div>

            <div class="emoji-grid" id="emoji-grid">
                <!-- Grid items generated by JS -->
            </div>
        </section>

        <!-- Gesture Recognition View -->
        <section id="gesture-view" class="view-section">
            <div class="gesture-container">
                <div class="video-wrapper">
                    <video id="videoElement" autoplay playsinline></video>
                    <canvas id="canvasElement" style="display:none;"></canvas>
                    <div id="gesture-overlay" class="gesture-overlay">
                        <span id="gesture-text">Waiting for gesture...</span>
                    </div>
                </div>
                <div class="camera-controls">
                    <button id="toggle-camera-btn" class="action-btn">
                        <i class="fa-solid fa-camera"></i> Start Camera
                    </button>
                </div>
            </div>
        </section>

        <!-- Emergency View -->
        <section id="emergency-view" class="view-section emergency-mode">
            <h2>Emergency Mode</h2>
            <div class="emergency-grid">
                <button class="em-card" data-message="I need help immediately." style="--clr: #e74c3c;">
                    <i class="fa-solid fa-kit-medical"></i>
                    <span>HELP</span>
                </button>
                <button class="em-card" data-message="Call an ambulance." style="--clr: #3498db;">
                    <i class="fa-solid fa-truck-medical"></i>
                    <span>AMBULANCE</span>
                </button>
                <button class="em-card" data-message="I am in danger." style="--clr: #e67e22;">
                    <i class="fa-solid fa-fire"></i>
                    <span>DANGER</span>
                </button>
                <button class="em-card" id="location-btn" style="--clr: #2ecc71;">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>LOCATION</span>
                </button>
            </div>
            <button id="close-emergency-btn" class="close-btn">Exit Emergency Mode</button>
        </section>
    </main>

    <!-- Socket.io -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
